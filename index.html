<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Totenreich – Schüttelkugel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #09070b;
      color: #ffe7bd;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .app {
      width: min(100vw, 760px);
      padding: 12px;
    }

    .stage {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 28px;
      background:
        radial-gradient(
          circle at 50% 40%,
          #44285d,
          #160f1c 65%,
          #080609
        );
      box-shadow: 0 20px 60px #000;
    }

    .bg {
      position: absolute;
      inset: 0;
      background-image: url("totenreich.png");
      background-position: center;
      background-size: contain;
      background-repeat: no-repeat;
    }

    /*
      Unsichtbarer Animationsbereich.
      Dieser Bereich liegt nur über dem Glas,
      nicht über dem Holzsockel.
    */
    .globe {
      position: absolute;
      left: 18%;
      top: 5%;
      width: 64%;
      height: 64%;
      overflow: hidden;
      border-radius: 50%;
      pointer-events: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .ui {
      position: absolute;
      left: 50%;
      bottom: 2.5%;
      z-index: 10;
      width: 94%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      transform: translateX(-50%);
      transition: opacity 0.4s ease;
    }

    .btn {
      padding: 11px 15px;
      border: 1px solid #e39b35;
      border-radius: 999px;
      background: rgba(36, 20, 25, 0.91);
      color: #ffe7bd;
      font-size: 14px;
      font-weight: 700;
    }

    .status {
      width: 100%;
      text-align: center;
      font-size: 12px;
      text-shadow: 0 1px 3px #000;
    }

    .ui.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="stage">

      <div class="bg"></div>

      <div class="globe">
        <canvas id="leafCanvas"></canvas>
      </div>

      <div class="ui" id="controls">
        <button class="btn" id="motionButton" type="button">
          🍂 Schütteleffekt aktivieren
        </button>

        <button class="btn" id="testButton" type="button">
          🍁 Aufwirbeln
        </button>

        <div class="status" id="status" aria-live="polite">
          Zum Testen „Aufwirbeln“ antippen.
        </div>
      </div>

    </section>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("leafCanvas");
      const context = canvas.getContext("2d");

      const controls = document.getElementById("controls");
      const motionButton = document.getElementById("motionButton");
      const testButton = document.getElementById("testButton");
      const status = document.getElementById("status");

      let width = 0;
      let height = 0;
      let leaves = [];
      let lastShakeTime = 0;
      let motionEnabled = false;

      const random = (minimum, maximum) =>
        Math.random() * (maximum - minimum) + minimum;

      function resizeCanvas() {
        const rectangle = canvas.getBoundingClientRect();
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

        width = rectangle.width;
        height = rectangle.height;

        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);

        context.setTransform(
          pixelRatio,
          0,
          0,
          pixelRatio,
          0,
          0
        );

        /*
          Nach einer Größenänderung werden die Blätter
          neu innerhalb des sichtbaren Glases verteilt.
        */
        createLeaves();
      }

      class Leaf {
        constructor() {
          this.x = random(width * 0.20, width * 0.80);

          /*
            Die Blätter starten sichtbar im unteren
            inneren Teil der Glaskugel.
          */
          this.y = random(height * 0.68, height * 0.80);

          /*
            Kleinere, aber weiterhin gut sichtbare Blätter.
          */
          this.size = random(4, 9);

          this.angle = random(0, Math.PI * 2);
          this.rotationSpeed = 0;
          this.velocityX = 0;
          this.velocityY = 0;
          this.swingPhase = random(0, Math.PI * 2);
          this.swingSpeed = random(0.025, 0.06);

          const colors = [
            "#a54216",
            "#c95d17",
            "#df7c20",
            "#8e3317",
            "#e39b35",
            "#71321d",
            "#b84b1c",
            "#d56a22"
          ];

          this.color =
            colors[Math.floor(Math.random() * colors.length)];
        }

        update() {
          this.velocityX *= 0.992;
          this.velocityY += 0.035;

          this.velocityY = Math.min(
            this.velocityY,
            1.45
          );

          this.swingPhase += this.swingSpeed;

          const sidewaysMovement =
            Math.sin(this.swingPhase) * 0.35;

          this.x += this.velocityX + sidewaysMovement;
          this.y += this.velocityY;
          this.angle += this.rotationSpeed;

          /*
            Die Blätter werden im unteren Glasbereich
            abgelegt und nicht auf dem Holzsockel.
          */
          if (this.y > height * 0.82) {
            this.y = random(
              height * 0.72,
              height * 0.81
            );

            this.velocityX = 0;
            this.velocityY = 0;
            this.rotationSpeed *= 0.2;
          }

          if (this.x < 10) {
            this.x = 10;
            this.velocityX *= -0.5;
          }

          if (this.x > width - 10) {
            this.x = width - 10;
            this.velocityX *= -0.5;
          }
        }

        draw() {
          context.save();

          context.translate(this.x, this.y);
          context.rotate(this.angle);

          context.beginPath();

          context.moveTo(0, -this.size);

          context.bezierCurveTo(
            this.size * 0.8,
            -this.size * 0.4,
            this.size * 0.7,
            this.size * 0.5,
            0,
            this.size
          );

          context.bezierCurveTo(
            -this.size * 0.7,
            this.size * 0.5,
            -this.size * 0.8,
            -this.size * 0.4,
            0,
            -this.size
          );

          context.fillStyle = this.color;
          context.fill();

          context.beginPath();

          context.moveTo(
            0,
            -this.size * 0.7
          );

          context.lineTo(
            0,
            this.size
          );

          context.strokeStyle = "rgba(84, 35, 15, 0.72)";
          context.lineWidth = 1;
          context.stroke();

          context.restore();
        }
      }

      function createLeaves() {
        if (!width || !height) {
          return;
        }

        leaves = Array.from(
          { length: 42 },
          () => new Leaf()
        );
      }

      function blowLeaves(strength = 1) {
        const currentTime = Date.now();

        if (currentTime - lastShakeTime < 700) {
          return;
        }

        lastShakeTime = currentTime;

        for (const leaf of leaves) {
          leaf.velocityX +=
            random(-4.2, 4.2) * strength;

          leaf.velocityY =
            random(-8.5, -3.8) * strength;

          leaf.rotationSpeed =
            random(-0.16, 0.16);
        }

        status.textContent =
          "🍂 Das Laub wirbelt im Totenreich auf …";

        window.setTimeout(() => {
          status.textContent =
            "🍁 Das Laub fällt langsam wieder herunter.";
        }, 1100);
      }

      function animate() {
        context.clearRect(
          0,
          0,
          width,
          height
        );

        for (const leaf of leaves) {
          leaf.update();
          leaf.draw();
        }

        window.requestAnimationFrame(animate);
      }

      function handleMotion(event) {
        if (!motionEnabled) {
          return;
        }

        const acceleration =
          event.accelerationIncludingGravity ||
          event.acceleration;

        if (!acceleration) {
          return;
        }

        const x = Number(acceleration.x) || 0;
        const y = Number(acceleration.y) || 0;
        const z = Number(acceleration.z) || 0;

        const force = Math.hypot(x, y, z);

        if (force > 17) {
          const strength = Math.min(
            1.5,
            Math.max(0.85, force / 22)
          );

          blowLeaves(strength);
        }
      }

      testButton.addEventListener("click", () => {
        blowLeaves(1);
      });

      motionButton.addEventListener("click", async () => {
        try {
          if (typeof DeviceMotionEvent === "undefined") {
            status.textContent =
              "Der Bewegungssensor ist nicht verfügbar.";

            return;
          }

          if (
            typeof DeviceMotionEvent.requestPermission ===
            "function"
          ) {
            const permission =
              await DeviceMotionEvent.requestPermission();

            if (permission !== "granted") {
              status.textContent =
                "Der Bewegungszugriff wurde nicht erlaubt.";

              return;
            }
          }

          window.addEventListener(
            "devicemotion",
            handleMotion
          );

          motionEnabled = true;
          motionButton.disabled = true;
          motionButton.textContent = "✓ Schütteln aktiv";

          status.textContent =
            "📱 Jetzt das iPhone schütteln.";

          /*
            Nach erfolgreicher Aktivierung verschwinden
            Buttons und Hinweistext automatisch.
          */
          window.setTimeout(() => {
            controls.classList.add("hidden");

            window.setTimeout(() => {
              controls.style.display = "none";
            }, 450);
          }, 2000);

        } catch (error) {
          console.error(error);

          status.textContent =
            "Der Bewegungssensor konnte nicht aktiviert werden.";
        }
      });

      window.addEventListener(
        "resize",
        resizeCanvas
      );

      resizeCanvas();
      animate();
    })();
  </script>
</body>
</html>
