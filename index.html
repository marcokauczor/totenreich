<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Totenreich - Schuettelkugel</title>
<style>
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#09070b;color:#ffe7bd;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:grid;place-items:center;min-height:100vh;overflow:hidden}.app{width:min(100vw,760px);padding:12px}.stage{position:relative;aspect-ratio:1/1;border-radius:28px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#44285d,#160f1c 65%,#080609);box-shadow:0 20px 60px #000}
.bg{position:absolute;inset:0;background-image:url('totenreich.png');background-position:center;background-size:contain;background-repeat:no-repeat}.globe{position:absolute;left:9%;top:2%;width:82%;height:82%;border-radius:50%;overflow:hidden;pointer-events:none}canvas{width:100%;height:100%;display:block}
.ui{position:absolute;left:50%;bottom:2.5%;transform:translateX(-50%);width:94%;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.btn{border:1px solid #e39b35;border-radius:999px;padding:11px 15px;background:#241419e8;color:#ffe7bd;font-weight:700;font-size:14px}.status{width:100%;text-align:center;font-size:12px;text-shadow:0 1px 3px #000}
</style></head><body><main class="app"><section class="stage"><div class="bg"></div><div class="globe"><canvas id="c"></canvas></div><div class="ui"><button class="btn" id="motion">🍂 Schütteleffekt aktivieren</button><button class="btn" id="test">🍁 Aufwirbeln</button><div class="status" id="status" aria-live="polite">Zum Testen „Aufwirbeln“ antippen.</div></div></section></main>
<script>
(()=>{const c=document.querySelector('#c'),x=c.getContext('2d'),status=document.querySelector('#status'),motion=document.querySelector('#motion');let w=0,h=0,leaves=[],last=0,enabled=false;const rnd=(a,b)=>Math.random()*(b-a)+a;
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;c.width=Math.round(w*d);c.height=Math.round(h*d);x.setTransform(d,0,0,d,0,0);if(!leaves.length)init()}addEventListener('resize',resize);
class Leaf{constructor(){this.x=rnd(w*.15,w*.85);this.y=rnd(h*.82,h*.95);this.s=rnd(5,12);this.a=rnd(0,6.28);this.va=0;this.vx=0;this.vy=0;this.phase=rnd(0,6.28);this.col=['#a54216','#c95d17','#df7c20','#8e3317','#e39b35','#71321d'][Math.floor(rnd(0,6))]} update(){this.vx*=.992;this.vy=Math.min(this.vy+.035,1.6);this.phase+=.04;this.x+=this.vx+Math.sin(this.phase)*.35;this.y+=this.vy;this.a+=this.va;if(this.y>h*.96){this.y=rnd(h*.88,h*.95);this.vx=this.vy=0;this.va*=.2}if(this.x<10||this.x>w-10)this.vx*=-.5;this.x=Math.max(10,Math.min(w-10,this.x))} draw(){x.save();x.translate(this.x,this.y);x.rotate(this.a);x.beginPath();x.moveTo(0,-this.s);x.bezierCurveTo(this.s*.8,-this.s*.4,this.s*.7,this.s*.5,0,this.s);x.bezierCurveTo(-this.s*.7,this.s*.5,-this.s*.8,-this.s*.4,0,-this.s);x.fillStyle=this.col;x.fill();x.strokeStyle='#54230faa';x.beginPath();x.moveTo(0,-this.s*.7);x.lineTo(0,this.s);x.stroke();x.restore()}}
function init(){leaves=Array.from({length:48},()=>new Leaf())}function blow(str=1){const n=Date.now();if(n-last<700)return;last=n;for(const l of leaves){l.vx+=rnd(-4.5,4.5)*str;l.vy=rnd(-9,-3.8)*str;l.va=rnd(-.17,.17)}status.textContent='🍂 Das Laub wirbelt auf …';setTimeout(()=>status.textContent='🍁 … und fällt langsam wieder herunter.',1100)}
function frame(){x.clearRect(0,0,w,h);for(const l of leaves){l.update();l.draw()}requestAnimationFrame(frame)}function onMotion(e){if(!enabled)return;const a=e.accelerationIncludingGravity||e.acceleration;if(!a)return;const f=Math.hypot(Number(a.x)||0,Number(a.y)||0,Number(a.z)||0);if(f>17)blow(Math.min(1.5,Math.max(.85,f/22)))}
document.querySelector('#test').addEventListener('click',()=>blow(1));motion.addEventListener('click',async()=>{try{if(typeof DeviceMotionEvent==='undefined'){status.textContent='Bewegungssensor ist hier nicht verfügbar.';return}if(typeof DeviceMotionEvent.requestPermission==='function'){const p=await DeviceMotionEvent.requestPermission();if(p!=='granted'){status.textContent='Bewegungszugriff wurde nicht erlaubt.';return}}addEventListener('devicemotion',onMotion);enabled=true;motion.disabled=true;motion.textContent='✓ Schütteln aktiv';status.textContent='📱 Jetzt das iPhone schütteln.'}catch(e){status.textContent='Bewegungssensor konnte nicht aktiviert werden.'}});resize();frame()})();
</script></body></html>
